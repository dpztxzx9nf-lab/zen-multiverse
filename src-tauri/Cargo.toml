[package]
name = "zen-multiverse"
version = "0.2.2"
description = "Zen Multiverse"
authors = ["Brock Knechtel"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "zen_multiverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
