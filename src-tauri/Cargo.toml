[package]
name = "zen-multiverse"
version = "0.1.0"
description = "Zen Multiverse"
authors = ["Brock Knechtel"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "zen_multiverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
