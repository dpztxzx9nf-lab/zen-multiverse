<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e33"/>
      <stop offset="1" stop-color="#0c0d0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb24d" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ffb24d" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffb24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4e3a6"/>
      <stop offset="1" stop-color="#5c9c68"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c8268"/>
      <stop offset="1" stop-color="#c8ad8e"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#565b63"/>
      <stop offset="1" stop-color="#363a40"/>
    </linearGradient>
  </defs>
  <rect id="bgrect" width="1024" height="1024" fill="url(#bg)"/>
  <g id="glyph" transform="translate(512,512) scale(0.8) translate(-512,-572)">
    <circle cx="512" cy="470" r="330" fill="url(#glow)"/>
    <!-- amber moon, the one warm accent -->
    <circle cx="636" cy="322" r="36" fill="#f2b45e"/>
    <!-- branches -->
    <g fill="none" stroke="url(#bark)" stroke-linecap="round">
      <path d="M528 600 C 480 580, 430 575, 385 540" stroke-width="20"/>
      <path d="M552 540 C 590 515, 625 495, 665 478" stroke-width="17"/>
    </g>
    <!-- trunk -->
    <path d="M470 742 C 452 668, 566 632, 548 560 C 538 512, 474 492, 484 432 L 512 432 C 508 486, 574 512, 582 566 C 594 640, 506 670, 534 742 Z" fill="url(#bark)"/>
    <!-- canopy pads -->
    <g fill="url(#leaf)">
      <ellipse cx="495" cy="430" rx="128" ry="40"/>
      <circle cx="432" cy="414" r="54"/><circle cx="494" cy="384" r="70"/><circle cx="560" cy="408" r="58"/>
      <ellipse cx="372" cy="548" rx="104" ry="30"/>
      <circle cx="322" cy="538" r="44"/><circle cx="374" cy="514" r="54"/><circle cx="424" cy="536" r="44"/>
      <ellipse cx="672" cy="490" rx="96" ry="27"/>
      <circle cx="627" cy="480" r="41"/><circle cx="672" cy="458" r="51"/><circle cx="716" cy="480" r="39"/>
    </g>
    <!-- pot -->
    <rect x="318" y="730" width="388" height="26" rx="13" fill="#62676f"/>
    <path d="M344 756 L 680 756 L 652 820 Q 648 830 636 830 L 388 830 Q 376 830 372 820 Z" fill="url(#pot)"/>
    <rect x="396" y="830" width="44" height="14" rx="5" fill="#2e3136"/>
    <rect x="584" y="830" width="44" height="14" rx="5" fill="#2e3136"/>
  </g>
</svg>
