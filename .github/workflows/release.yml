# Build Windows and macOS installers only when a version tag is pushed.
#
# Auto-update: tauri-action signs the updater bundles with TAURI_SIGNING_PRIVATE_KEY and uploads
# latest.json to the GitHub release. The app checks
#   https://github.com/dpztxzx9nf-lab/zen-multiverse/releases/latest/download/latest.json
# so the release must be published (not a draft, not a prerelease) for /latest to point at it.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles msi,nsis'
            rust_targets: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          # releaseBody is also the update prompt text in latest.json: keep it a short, friendly summary
          releaseBody: |
            The app is called Xenia now (same identifier and update feed, so this version still arrives by itself). The home world is new. Bleachflats, Rustmesa, Glasswood, Shatter Coast and Snow Peaks each have their own look, and the Hollow under the ground has caves and ores (including Resonite). Old terrain edits are cleared; your account and save still load. Walk out of the city to a Rattler camp grown from the world seed and take the scrap and ore in its crates. The pickaxe, axe and shovel still work. City and garden ground still can't be dug; the wild land around them stays buildable for later claims. From 0.2.33: Dev mode now actually gives you the M4, and the leftover opening quest and hammer-and-build tools are gone. From 0.2.32: a Dev mode at the top of Settings, only on the owner account, unlocks everything and gives you an M4 so you can try combat.
          releaseDraft: false
          prerelease: false
          # attach latest.json (merged across the Windows and macOS jobs) to the release
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  checksums:
    name: Upload SHA-256 checksums
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Hash release files and attach SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir release-files
          (
            cd release-files
            find . -type f ! -name 'SHA256SUMS.txt' -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum
          ) > SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" SHA256SUMS.txt --clobber
