# Build Windows and macOS installers only when a version tag is pushed.
#
# Auto-update: tauri-action signs the updater bundles with TAURI_SIGNING_PRIVATE_KEY and uploads
# latest.json to the GitHub release. The app checks
#   https://github.com/dpztxzx9nf-lab/zen-multiverse/releases/latest/download/latest.json
# so the release must be published (not a draft, not a prerelease) for /latest to point at it.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles msi,nsis'
            rust_targets: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          # releaseBody is also the update prompt text in latest.json: keep it a short, friendly summary
          releaseBody: |
            There's a greybox city on the home Earth globe now, just outside the garden toward the bay. New players start in the plaza at Night Market: a street grid, Beach Bay, Bank Tower, the docks, Mansion Row and eight named plots, so you can say "meet at the docks." Walls there are real for everyone. The garden arrival stone stays where it was, and the home beacon still returns there. From 0.2.27: the hares, the fox and the deer walk round tree trunks, rocks and the garden wall instead of stopping dead in front of them. From 0.2.26: updates install even when the game is in the background: a new version now installs and restarts even if the game is minimized, hidden or covered by another window. From 0.2.25: walls are real for everyone: the server holds every player to the same walls, rocks, tents and buildings the game draws, so nobody can walk through them, even with a modified game. Other players, camp folk, foxes and deer are solid too, but nobody can push you around or box you in: keep walking into someone for a couple of seconds and you slip past. From 0.2.24: no more surprise disconnects after a restart on a planet: starting the game again (or an automatic update) no longer counts as a jump and can't kick you. From 0.2.23: what you build on a planet stays there: pieces and digs on a planet show again after a restart or reload, instead of seeming to vanish (they were always saved). Also from 0.2.22: the game now updates and restarts by itself. New versions download quietly, then it saves and relaunches at a calm moment. There is no Update, Restart or Reconnect button to click, and a server update puts you back where you were.
          releaseDraft: false
          prerelease: false
          # attach latest.json (merged across the Windows and macOS jobs) to the release
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  checksums:
    name: Upload SHA-256 checksums
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Hash release files and attach SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir release-files
          (
            cd release-files
            find . -type f ! -name 'SHA256SUMS.txt' -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum
          ) > SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" SHA256SUMS.txt --clobber
