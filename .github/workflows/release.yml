# Build Windows and macOS installers only when a version tag is pushed.
#
# Auto-update: tauri-action signs the updater bundles with TAURI_SIGNING_PRIVATE_KEY and uploads
# latest.json to the GitHub release. The app checks
#   https://github.com/dpztxzx9nf-lab/zen-multiverse/releases/latest/download/latest.json
# so the release must be published (not a draft, not a prerelease) for /latest to point at it.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles msi,nsis'
            rust_targets: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          # releaseBody is also the update prompt text in latest.json: keep it a short, friendly summary
          releaseBody: |
            A bold new look. The whole game is now painted in our Raked Light style: soft bands of warm sunlight and cool shadow, ink outlines, a painted sky with big cartoon clouds, a sea with colour bands, shore foam and sparkles, and richer colours everywhere.
          releaseDraft: false
          prerelease: false
          # attach latest.json (merged across the Windows and macOS jobs) to the release
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  checksums:
    name: Upload SHA-256 checksums
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Hash release files and attach SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir release-files
          (
            cd release-files
            find . -type f ! -name 'SHA256SUMS.txt' -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum
          ) > SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" SHA256SUMS.txt --clobber
