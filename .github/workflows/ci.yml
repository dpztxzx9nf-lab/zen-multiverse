# Checks on every push and pull request to main: lint + parse + unit tests, the server tests against a
# local wrangler dev, and a headless smoke boot of the game (software WebGL, offline). Releases are
# separate (release.yml, version tags only). The long Playwright and wrangler jobs stay here on
# GitHub — locally, run `npm test` (a couple of seconds) instead of this full suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, parse, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-eslint9-globals15
          restore-keys: npm-${{ runner.os }}-
      - name: Install lint tools
        run: npm i --no-save --no-package-lock eslint@9 globals@15
      - name: Lint (bug-catching rules only)
        run: npx eslint .
      - name: Parse and unit tests (`npm test`)
        run: npm test

  server:
    name: Server tests (local wrangler)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-wrangler4
          restore-keys: npm-${{ runner.os }}-
      - name: Install wrangler
        run: npm i -g wrangler@4
      - name: Test-only dev vars
        run: cp server/.dev.vars.example server/.dev.vars
      - name: Server tests
        run: bash tools/ci/server-tests.sh

  smoke:
    name: Headless smoke boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1
      - name: Install Playwright
        run: |
          pip install playwright==1.*
          python -m playwright install --with-deps chromium
      - name: Boot, run frames, hop worlds; fail on console errors or NaN positions
        run: |
          python3 -m http.server 8090 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          timeout 900 python3 tools/ci/smoke.py http://127.0.0.1:8090 90

  collision:
    name: Collision ("if you can see it, it's real")
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1
      - name: Install Playwright
        run: |
          pip install playwright==1.*
          python -m playwright install --with-deps chromium
      - name: Audit every visible mesh against the colliders, walk into solids, third-person camera by walls
        run: |
          python3 -m http.server 8091 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          mkdir -p collision-shots
          timeout 1500 python3 tools/ci/collision.py http://127.0.0.1:8091 --report collision-report.json --shots collision-shots
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-report
          path: |
            collision-report.json
            collision-shots/
          if-no-files-found: ignore

  solids-data:
    name: Server walls match the game (js/solids-data.js is current)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1
      - name: Install Playwright
        run: |
          pip install playwright==1.*
          python -m playwright install --with-deps chromium
      - name: Re-bake the scenery on every device class and season; fail if the server's copy is stale
        run: |
          python3 -m http.server 8092 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          timeout 2100 python3 tools/ci/solids-export.py http://127.0.0.1:8092 --check
